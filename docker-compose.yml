services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      COMPOSER_HOME: /tmp/composer
    ports:
      - "8081:8000"
    entrypoint: ["./docker-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    entrypoint: []
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - backend

  frontend:
    build: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_TARGET: http://backend:8000
      WS_TARGET: http://reverb:8080
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
